# בונה APK בכל שינוי בפרויקט, ומפרסם אותו בדף ה-Releases להורדה ישר לטלפון
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: הורדת הקוד
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: בנייה
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

      # כשהבנייה נכשלת, פותח Issue עם השגיאות כדי שאפשר יהיה לקרוא אותן
      - name: דיווח שגיאות
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '```'
            grep -E "^e: |error:|FAILURE:|What went wrong|Caused by|> Task .* FAILED" /tmp/build.log | head -80 || true
            echo '```'
          } > /tmp/body.md
          gh issue create --title "בנייה ${{ github.run_number }} נכשלה" --body-file /tmp/body.md

      - name: שמירת ה-APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelLauncher
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: פרסום להורדה
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PixelLauncher ${{ github.run_number }}
          body: נבנה מהשינוי ${{ github.sha }}
          files: app/build/outputs/apk/debug/app-debug.apk
